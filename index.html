<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值班日历生成器</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f5f5f5;color:#222}
h1{text-align:center;font-size:24px}
.card,.rule{background:#fff;padding:14px;margin-bottom:14px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{font-weight:600;display:block;margin-top:8px}
input{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.add{background:#1677ff;color:white}.generate{background:#22a06b;color:white}.delete{background:#e5484d;color:white}.small{font-size:13px;color:#666;line-height:1.5}
.preview{white-space:pre-wrap;background:#111;color:#0f0;padding:10px;border-radius:8px;max-height:220px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<h1>值班日历生成器</h1>

<div class="card">
<label>生成截止日期</label>
<input type="date" id="endDate" value="2026-12-31">
<p class="small">说明：可添加多条规则，每条规则都有自己的起始日期、周期和名称。最后统一生成一个 duty.ics。</p>
</div>

<div id="rules"></div>

<button class="add" onclick="addRule()">添加规则</button>
<button class="generate" onclick="generateICS()">生成并下载 duty.ics</button>

<div class="card">
<p class="small">生成后，把 duty.ics 上传到 GitHub 仓库根目录，iPhone 订阅地址为：</p>
<div class="preview">webcal://你的用户名.github.io/duty.ics</div>
</div>

<script>
let rules = [];

function addRule(data={}){
  rules.push({
    id: Date.now() + Math.random(),
    name: data.name || "",
    start: data.start || "",
    interval: data.interval || 9
  });
  render();
}

function deleteRule(id){
  rules = rules.filter(r => r.id !== id);
  render();
}

function updateRule(id,key,value){
  const rule = rules.find(r => r.id === id);
  if(rule) rule[key] = value;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function render(){
  let html = "";
  rules.forEach((rule, index) => {
    html += `
    <div class="rule">
      <h3>规则 ${index + 1}</h3>
      <label>轮次名称</label>
      <input value="${escapeHtml(rule.name)}" placeholder="例如：石宇、杨惠明" onchange="updateRule(${rule.id},'name',this.value)">
      <label>起始日期</label>
      <input type="date" value="${rule.start}" onchange="updateRule(${rule.id},'start',this.value)">
      <label>周期（天）</label>
      <input type="number" min="1" value="${rule.interval}" onchange="updateRule(${rule.id},'interval',this.value)">
      <button class="delete" onclick="deleteRule(${rule.id})">删除此规则</button>
    </div>`;
  });
  document.getElementById("rules").innerHTML = html;
}

function formatDate(d){
  return d.toISOString().slice(0,10).replace(/-/g,"");
}

function generateICS(){
  const endDateValue = document.getElementById("endDate").value;
  if(!endDateValue){ alert("请先设置截止日期"); return; }

  const endDate = new Date(endDateValue + "T00:00:00");
  let events = [];

  rules.forEach(rule => {
    if(!rule.name || !rule.start || !rule.interval) return;
    let current = new Date(rule.start + "T00:00:00");
    const interval = parseInt(rule.interval, 10);
    if(!interval || interval < 1) return;

    while(current <= endDate){
      events.push({
        date: new Date(current),
        title: rule.name
      });
      current.setDate(current.getDate() + interval);
    }
  });

  events.sort((a,b) => a.date - b.date || a.title.localeCompare(b.title));

  let ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Duty Calendar Generator//CN",
    "CALSCALE:GREGORIAN",
    "X-WR-CALNAME:值班"
  ].join("\r\n") + "\r\n";

  events.forEach((ev, idx) => {
    const next = new Date(ev.date);
    next.setDate(next.getDate() + 1);
    const uid = "duty-" + formatDate(ev.date) + "-" + idx + "@github-pages";
    ics += [
      "BEGIN:VEVENT",
      "UID:" + uid,
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z/,"Z"),
      "DTSTART;VALUE=DATE:" + formatDate(ev.date),
      "DTEND;VALUE=DATE:" + formatDate(next),
      "SUMMARY:" + ev.title,
      "END:VEVENT"
    ].join("\r\n") + "\r\n";
  });

  ics += "END:VCALENDAR\r\n";

  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "duty.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

addRule({name:"石宇、杨惠明", start:"2026-01-03", interval:9});
addRule({name:"褚海明、石宇", start:"2026-01-19", interval:28});
</script>
</body>
</html>
